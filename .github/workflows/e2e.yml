name: e2e
# Real Claude CLI against the hooks and the gate. Manual only: it spends API credit.
# Needs the repository secret ANTHROPIC_API_KEY. Windows adds the four PowerShell-tool checks.
on: workflow_dispatch
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the CLI version these checks were last verified with; bump it on purpose
      CLAUDE_CODE_VERSION: "2.1.317"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - run: npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python e2e/smoke.py --model haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
