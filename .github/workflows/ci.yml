name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - run: python -m pytest -q gate/tests e2e/test_smoke_checks.py
      - run: node --test hooks/tests/guard.test.js hooks/tests/fuzz.test.js bench/tests/replay.test.js bench/tests/corpus.test.js
      # The differential test runs rm -rf for real. Windows: on this GitHub-hosted VM, thrown away
      # after the job. Linux: in a container with no network, no capabilities, a non-root user,
      # a read-only root and the repo mounted read-only. DIFF_REQUIRE: a skip is a failure here.
      - name: differential (Windows, throwaway VM)
        if: runner.os == 'Windows'
        run: node --test hooks/tests/differential.test.js
        env:
          DIFF_REQUIRE: bash,pwsh
      - name: differential (Linux, locked-down container)
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --user node --read-only --tmpfs /tmp:rw,size=512m --tmpfs /w:rw,exec,size=256m,mode=1777 -v "$PWD:/repo:ro" -e DIFF_REQUIRE=bash node:22
          bash -c "cp -r /repo/. /w && cd /w && node --test hooks/tests/differential.test.js"
